name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install App Dependencies
        working-directory: artifacts/autochip-finder
        run: npm install --ignore-scripts

      - name: Link node_modules and package.json to android folder
        run: |
          rm -rf artifacts/autochip-finder/android/node_modules
          rm -f artifacts/autochip-finder/android/package.json
          ln -s "${{ github.workspace }}/artifacts/autochip-finder/node_modules" artifacts/autochip-finder/android/node_modules
          ln -s "${{ github.workspace }}/artifacts/autochip-finder/package.json" artifacts/autochip-finder/android/package.json
          cd artifacts/autochip-finder/android
          node --print "require.resolve('expo/package.json')"
          node --print "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"

      - name: Make Gradlew Executable
        working-directory: artifacts/autochip-finder/android
        run: chmod +x gradlew

      - name: Build Standalone Release APK
        working-directory: artifacts/autochip-finder/android
        env:
          NODE_PATH: ${{ github.workspace }}/artifacts/autochip-finder/node_modules
        run: ./gradlew assembleRelease --no-daemon --info --stacktrace

      - name: Rename and Prepare APK for Distribution
        run: |
          mkdir -p dist-apk
          cp artifacts/autochip-finder/android/app/build/outputs/apk/release/*.apk dist-apk/AutoChipFinder-v1.0.0.apk
          ls -lh dist-apk/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoChipFinder-v1.0.0-APK
          path: dist-apk/AutoChipFinder-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AutoChip Finder v1.0.0 (Standalone APK)"
          draft: false
          prerelease: false
          body: |
            ### 🚗 AutoChip Finder — Standalone Android APK
            
            This is the standalone APK for **AutoChip Finder**. You can install and run it independently on any Android device without requiring Expo Go or Google Play Store.

            #### 📥 Download:
            Download the `AutoChipFinder-v1.0.0.apk` file below and tap **Install** on your Android phone.

            #### ✨ Features:
            - **100% Offline Search:** Complete offline library with instant indexed queries.
            - **4 Core Field Details:** Brand, Model, Part Number, and Chip Number.
            - **Animated Splash Screen:** Custom startup animation with realistic initialization indicator.
            - **Professional Hardware Logo:** Custom diagnostic microchip brand mark.
          files: dist-apk/AutoChipFinder-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
