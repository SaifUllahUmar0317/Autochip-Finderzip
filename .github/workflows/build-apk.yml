name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install App Dependencies
        working-directory: artifacts/autochip-finder
        run: npm install

      - name: Run Expo Prebuild (Generate Native Android Project)
        working-directory: artifacts/autochip-finder
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make Gradlew Executable
        working-directory: artifacts/autochip-finder/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: artifacts/autochip-finder/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist-apk
          cp artifacts/autochip-finder/android/app/build/outputs/apk/release/*.apk dist-apk/AutoChipFinder-v1.0.0.apk
          ls -lh dist-apk/

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoChipFinder-v1.0.0-APK
          path: dist-apk/AutoChipFinder-v1.0.0.apk
          retention-days: 90

      - name: Delete Old Release if Exists
        run: |
          gh release delete v1.0.0 --yes || true
          git push --delete origin v1.0.0 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AutoChip Finder v1.0.0 — Standalone APK"
          draft: false
          prerelease: false
          body: |
            ### 🚗 AutoChip Finder — Standalone Android APK

            Install and run on **any Android device** — no Expo Go or Play Store needed.

            #### 📥 How to Install
            1. Download `AutoChipFinder-v1.0.0.apk` from the assets below.
            2. On your Android phone go to **Settings → Security → Unknown Sources** and enable it.
            3. Open the downloaded APK file and tap **Install**.

            #### ✨ Features
            - 100 % offline chip lookup — no internet required after install
            - Instant indexed search by Part Number or Chip Number
            - Animated splash screen with custom logo
          files: dist-apk/AutoChipFinder-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
